[package]
name = "mediares_core"
version = "0.1.0"
edition = "2021"

[dependencies]
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp", "tiff", "ico"] }
lru = "0.18.4"
memchr = "2.7"
windows = { version = "0.62.2", features = [
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Globalization",
] }

[features]
default = ["raw-preview", "psd-preview"]
raw-preview = []
psd-preview = []
audio-decode = []
tags = []
