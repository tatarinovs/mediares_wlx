[workspace]
members = [
    "core",
    "wdx",
    "combo",
]
resolver = "2"

[profile.release]
opt-level = 2
lto = true
codegen-units = 1
strip = true
panic = "unwind"

# Cold code built for size: tag parsing (symphonia-metadata and its regex-lite), container
# demuxing (reads packets; decoding stays at opt-level 2), ICC color management, the Windows API
# wrappers. About -128 KB per DLL with the same hashing and fingerprinting speed (2026-10 bench).
# The plugin crates themselves stay at 2: "s" there saved another 200-330 KB, but audio
# fingerprinting got ~20% slower.

[profile.release.package.symphonia-metadata]
opt-level = "s"

[profile.release.package.regex-lite]
opt-level = "s"

[profile.release.package.moxcms]
opt-level = "s"

[profile.release.package.pxfm]
opt-level = "s"

[profile.release.package.symphonia-format-caf]
opt-level = "s"

[profile.release.package.symphonia-format-isomp4]
opt-level = "s"

[profile.release.package.symphonia-format-mkv]
opt-level = "s"

[profile.release.package.symphonia-format-ogg]
opt-level = "s"

[profile.release.package.symphonia-format-riff]
opt-level = "s"

[profile.release.package.windows]
opt-level = "s"

[profile.release.package.windows-core]
opt-level = "s"

[profile.release.package.windows-result]
opt-level = "s"

[profile.release.package.windows-strings]
opt-level = "s"

[profile.release.package.log]
opt-level = "s"
