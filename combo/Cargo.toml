[package]
name = "mediares_combo"
version = "0.4.2"
edition = "2021"
license = "MIT"

[lib]
name = "mediares_combo"
crate-type = ["cdylib", "rlib"]

[dependencies]
mediares_core = { path = "../core", features = ["raw-preview", "psd-preview", "audio-decode", "tags"] }
windows-core = "0.62.2"
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Globalization",
    "Win32_Media_Audio",
    "Win32_Media_MediaFoundation",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_Storage_Xps",
    "Win32_UI_HiDpi",
    "Win32_System_LibraryLoader",
    "Win32_System_WindowsProgramming",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[lints.rust]
# MSVC prints "Creating library ...lib" for every DLL; rustc filters it only in English, so a
# localized Visual Studio turns it into a warning. Real linker errors still fail the build.
linker_messages = "allow"
