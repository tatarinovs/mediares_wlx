[package]
name = "mediares_wdx"
version = "0.4.0"
edition = "2021"
license = "MIT"

[lib]
name = "mediares_wdx"
crate-type = ["cdylib", "rlib"]

[dependencies]
mediares_core = { path = "../core", default-features = false, features = ["raw-preview", "psd-preview", "audio-decode", "tags"] }

[lints.rust]
# MSVC prints "Creating library ...lib" for every DLL; rustc filters it only in English, so a
# localized Visual Studio turns it into a warning. Real linker errors still fail the build.
linker_messages = "allow"
