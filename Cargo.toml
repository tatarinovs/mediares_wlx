[workspace]
members = [
    "core",
    "wdx",
    "combo",
]
resolver = "2"

[workspace.package]
version = "0.5.0"

[workspace.dependencies]
rusqlite = { version = "0.42.0", default-features = false, features = ["bundled"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = "symbols"
panic = "unwind"

# LTO also inlines hot core code into the DLL crates: keep all three at 2.
# Dependencies without overrides (container readers, Windows wrappers and cold codecs) use s.
[profile.release.package.mediares_core]
opt-level = 2

[profile.release.package.image]
opt-level = 2

[profile.release.package.zune-jpeg]
opt-level = 2

[profile.release.package.mediares_combo]
opt-level = 2

[profile.release.package.mediares_wdx]
opt-level = 2
