[package]
name = "mediares_core"
version = "0.4.2"
edition = "2021"
license = "MIT"

[dependencies]
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp", "ico", "tga", "hdr"] }
memchr = "2.7"
# Pinned: 1.1.10 moved to miniz_oxide 0.9 while png still uses 0.8, which would put both into
# the binary. Unpin once png moves to 0.9 (`cargo tree -d` then shows no miniz_oxide).
flate2 = "=1.1.9"
symphonia = { version = "0.6.1", optional = true, default-features = false, features = ["all-codecs", "all-formats", "all-meta"] }
windows = { version = "0.62.2", features = [
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_System_Time",
    "Win32_Foundation",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Imaging",
    "Win32_UI_Shell",
    "Win32_Globalization",
] }
windows-numerics = "0.3.1"

[features]
default = ["raw-preview", "psd-preview"]
raw-preview = []
psd-preview = []
audio-decode = ["dep:symphonia"]
tags = ["audio-decode"]
# OpenEXR: about +0.5 MB to the binary, so off unless asked for.
exr = ["image/exr"]

[[example]]
name = "audio_fp"
required-features = ["audio-decode", "tags"]
